<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#080b10;--surface:#0e1219;--surface2:#131821;--surface3:#181f2a;--border:#1c2230;--border2:#252f40;--accent:#e8a020;--accent-dim:rgba(232,160,32,.12);--accent-glow:rgba(232,160,32,.22);--text:#eef1f6;--text-mid:#8a97ab;--text-dim:#4a5568;--green:#34c97c;--blue:#4a9eff;--coral:#ff6b6b;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5;}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(8,11,16,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
.logo-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-link{font-size:12px;color:var(--text-mid);text-decoration:none;transition:color .2s;}
.nav-link:hover{color:var(--text);}
.nav-tag{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,160,32,.3);padding:3px 9px;border-radius:3px;}
.page{max-width:900px;margin:0 auto;padding:48px 32px 80px;position:relative;z-index:1;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,42px);font-weight:500;letter-spacing:-.025em;line-height:1.1;}
h1 em{font-style:italic;color:var(--accent);}
.page-desc{margin-top:10px;font-size:14px;font-weight:300;color:var(--text-mid);line-height:1.6;}
.calc-wrap{margin-top:40px;display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:start;}
@media(max-width:768px){.calc-wrap{grid-template-columns:1fr;}}
.calc-body{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.display{background:var(--surface3);padding:20px 20px 12px;border-bottom:1px solid var(--border);}
.display-expr{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);min-height:20px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.display-result{font-family:'JetBrains Mono',monospace;font-size:32px;color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px;}
.display-result.error{color:var(--coral);font-size:18px;}
.mode-row{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);}
.mode-btn{padding:5px 14px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text-dim);transition:all .2s;}
.mode-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,160,32,.4);}
.btn-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);}
.btn{padding:14px 8px;background:var(--surface2);border:none;color:var(--text-mid);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;transition:all .15s;text-align:center;}
.btn:hover{background:var(--surface3);color:var(--text);}
.btn.fn{color:var(--blue);}
.btn.op{color:var(--accent);}
.btn.eq{background:var(--accent);color:#080b10;font-weight:600;}
.btn.eq:hover{background:#f0b429;}
.btn.clr{color:var(--coral);}
.history-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
.history-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;}
.history-item{padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.history-item:last-child{border-bottom:none;}
.history-item:hover .hi-expr{color:var(--text);}
.hi-expr{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hi-result{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);}
.history-empty{font-size:12px;color:var(--text-dim);text-align:center;padding:20px 0;}
</style>

<body>
<nav>
  <a href="/" class="logo"><span class="logo-dot"></span>mymathtools</a>
  <div class="nav-right">
    <a href="/" class="nav-link">← All Tools</a>
    <span class="nav-tag">FREE</span>
  </div>
</nav>
<div class="page">
  <div class="eyebrow">// calculator.scientific_calculator</div>
  <h1>Scientific <em>Calculator</em></h1>
  <p class="page-desc">Full scientific calculator with trig, logarithms, exponents, roots, and constants. Deg/Rad toggle, keyboard support, and history.</p>

  <div class="calc-wrap">
    <div class="calc-body">
      <div class="display">
        <div class="display-expr" id="display-expr"></div>
        <div class="display-result" id="display-result">0</div>
      </div>
      <div class="mode-row">
        <button class="mode-btn active" id="btn-deg" onclick="setMode('deg')">DEG</button>
        <button class="mode-btn" id="btn-rad" onclick="setMode('rad')">RAD</button>
      </div>
      <div class="btn-grid">
        <button class="btn clr" onclick="clearAll()">AC</button>
        <button class="btn clr" onclick="backspace()">⌫</button>
        <button class="btn fn" onclick="append('(')">(</button>
        <button class="btn fn" onclick="append(')')">)</button>
        <button class="btn op" onclick="append('/')">÷</button>

        <button class="btn fn" onclick="appendFn('sin(')">sin</button>
        <button class="btn fn" onclick="appendFn('cos(')">cos</button>
        <button class="btn fn" onclick="appendFn('tan(')">tan</button>
        <button class="btn fn" onclick="appendFn('log(')">log</button>
        <button class="btn op" onclick="append('*')">×</button>

        <button class="btn fn" onclick="appendFn('asin(')">sin⁻¹</button>
        <button class="btn fn" onclick="appendFn('acos(')">cos⁻¹</button>
        <button class="btn fn" onclick="appendFn('atan(')">tan⁻¹</button>
        <button class="btn fn" onclick="appendFn('ln(')">ln</button>
        <button class="btn op" onclick="append('-')">−</button>

        <button class="btn fn" onclick="appendFn('sqrt(')">√</button>
        <button class="btn fn" onclick="appendFn('cbrt(')">∛</button>
        <button class="btn fn" onclick="append('**')">xʸ</button>
        <button class="btn fn" onclick="append('Math.PI')">π</button>
        <button class="btn op" onclick="append('+')">+</button>

        <button class="btn" onclick="append('7')">7</button>
        <button class="btn" onclick="append('8')">8</button>
        <button class="btn" onclick="append('9')">9</button>
        <button class="btn fn" onclick="appendFn('abs(')">|x|</button>
        <button class="btn fn" onclick="append('%')">%</button>

        <button class="btn" onclick="append('4')">4</button>
        <button class="btn" onclick="append('5')">5</button>
        <button class="btn" onclick="append('6')">6</button>
        <button class="btn fn" onclick="append('Math.E')">e</button>
        <button class="btn fn" onclick="append('1/')">1/x</button>

        <button class="btn" onclick="append('1')">1</button>
        <button class="btn" onclick="append('2')">2</button>
        <button class="btn" onclick="append('3')">3</button>
        <button class="btn fn" onclick="append('**2')">x²</button>
        <button class="btn fn" onclick="append('**3')">x³</button>

        <button class="btn" onclick="append('0')" style="grid-column:span 2;">0</button>
        <button class="btn" onclick="append('.')">.</button>
        <button class="btn fn" onclick="toggleSign()">±</button>
        <button class="btn eq" onclick="evaluate()">=</button>
      </div>
    </div>

    <div class="history-card">
      <div class="history-label">History (last 10)</div>
      <div id="history-list"><div class="history-empty">No calculations yet</div></div>
    </div>
  </div>
</div>

<script>
let expr = '', angleMode = 'deg', history = [];

function setMode(m) {
  angleMode = m;
  document.getElementById('btn-deg').classList.toggle('active', m === 'deg');
  document.getElementById('btn-rad').classList.toggle('active', m === 'rad');
}

function updateDisplay() {
  document.getElementById('display-expr').textContent = expr
    .replace(/Math\.PI/g, 'π').replace(/Math\.E/g, 'e').replace(/\*\*/g, '^').replace(/\*/g, '×').replace(/\//g, '÷');
}

function append(val) { expr += val; updateDisplay(); }
function appendFn(fn) { expr += fn; updateDisplay(); }
function clearAll() { expr = ''; document.getElementById('display-result').textContent = '0'; document.getElementById('display-result').className = 'display-result'; updateDisplay(); }
function backspace() { expr = expr.slice(0, -1); updateDisplay(); }
function toggleSign() { if (expr) expr = '(' + expr + ')*-1'; updateDisplay(); }

function evaluate() {
  if (!expr) return;
  try {
    const toRad = angleMode === 'deg' ? (Math.PI / 180) : 1;
    const safe = expr
      .replace(/Math\.PI/g, Math.PI)
      .replace(/Math\.E/g, Math.E)
      .replace(/sin\(/g, `Math.sin(${toRad}*(`)
      .replace(/cos\(/g, `Math.cos(${toRad}*(`)
      .replace(/tan\(/g, `Math.tan(${toRad}*(`)
      .replace(/asin\(/g, `(Math.asin(/`)
      .replace(/acos\(/g, `(Math.acos(/`)
      .replace(/atan\(/g, `(Math.atan(/`)
      .replace(/log\(/g, 'Math.log10(')
      .replace(/ln\(/g, 'Math.log(')
      .replace(/sqrt\(/g, 'Math.sqrt(')
      .replace(/cbrt\(/g, 'Math.cbrt(')
      .replace(/abs\(/g, 'Math.abs(');

    // Fix asin/acos/atan: they need /toRad at end
    const fixedSafe = safe
      .replace(/\(Math\.asin\(\//g, `(Math.asin(`)
      .replace(/\(Math\.acos\(\//g, `(Math.acos(`)
      .replace(/\(Math\.atan\(\//g, `(Math.atan(`);

    // eslint-disable-next-line no-new-func
    const result = Function('"use strict"; return (' + fixedSafe + ')')();
    const display = isFinite(result) ? parseFloat(result.toFixed(10)).toString() : result.toString();

    document.getElementById('display-result').textContent = display;
    document.getElementById('display-result').className = 'display-result';

    history.unshift({ expr: expr.replace(/Math\.PI/g,'π').replace(/Math\.E/g,'e'), result: display });
    if (history.length > 10) history.pop();
    renderHistory();
    expr = display === 'Infinity' || display === 'NaN' ? '' : display;
    updateDisplay();
  } catch {
    document.getElementById('display-result').textContent = 'Syntax Error';
    document.getElementById('display-result').className = 'display-result error';
  }
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!history.length) { el.innerHTML = '<div class="history-empty">No calculations yet</div>'; return; }
  el.innerHTML = history.map((h, i) =>
    `<div class="history-item" onclick="loadHistory(${i})">
      <div class="hi-expr">${h.expr}</div>
      <div class="hi-result">= ${h.result}</div>
    </div>`
  ).join('');
}

function loadHistory(i) { expr = history[i].result; updateDisplay(); }

document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') append(e.key);
  else if (['+','-','*','/','(',')','.','^','%'].includes(e.key)) append(e.key === '^' ? '**' : e.key);
  else if (e.key === 'Enter' || e.key === '=') evaluate();
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Escape') clearAll();
});
</script>
</body>
</html>
