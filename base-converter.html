<nav>

</nav>
<div class="page">
  <div class="eyebrow">// developer.base_converter</div>
  <h1>Number Base <em>Converter</em></h1>
  <p class="page-desc">Convert numbers between binary, octal, decimal, and hexadecimal instantly. Supports numbers up to 2⁵³.</p>

  <div class="tool-layout">
    <div class="card">
      <div class="card-label">Input</div>
      <div class="field-group">
        <label for="fromBase">From Base</label>
        <select id="fromBase">
          <option value="2">2 — Binary</option>
          <option value="8">8 — Octal</option>
          <option value="10" selected>10 — Decimal</option>
          <option value="16">16 — Hexadecimal</option>
        </select>
      </div>
      <div class="field-group">
        <label for="value">Input Value</label>
        <input type="text" id="value" placeholder="Enter value..."/>
        <div class="error-msg" id="error-msg"></div>
      </div>
    </div>

    <div>
      <div class="base-row">
        <div class="base-tag">Binary (Base 2)</div>
        <div class="base-val" id="out-bin">—</div>
        <div class="nibble-row" id="out-nibble"></div>
      </div>
      <div class="base-row">
        <div class="base-tag">Octal (Base 8)</div>
        <div class="base-val" id="out-oct">—</div>
      </div>
      <div class="base-row">
        <div class="base-tag">Decimal (Base 10)</div>
        <div class="base-val accent" id="out-dec">—</div>
      </div>
      <div class="base-row">
        <div class="base-tag">Hexadecimal (Base 16)</div>
        <div class="base-val" id="out-hex">—</div>
      </div>
    </div>
  </div>
</div>

<script>
const validChars = { 2: /^[01]+$/, 8: /^[0-7]+$/, 10: /^[0-9]+$/, 16: /^[0-9a-fA-F]+$/ };

function groupNibbles(bin) {
  const padded = bin.padStart(Math.ceil(bin.length / 4) * 4, '0');
  return padded.match(/.{4}/g).join(' ');
}

function calculate() {
  const base = parseInt(document.getElementById('fromBase').value);
  const val = document.getElementById('value').value.trim();
  const errEl = document.getElementById('error-msg');

  if (!val) {
    ['out-bin','out-oct','out-dec','out-hex'].forEach(id => document.getElementById(id).textContent = '—');
    document.getElementById('out-nibble').textContent = '';
    errEl.textContent = '';
    return;
  }

  if (!validChars[base].test(val)) {
    errEl.textContent = `Invalid character for base ${base}`;
    ['out-bin','out-oct','out-dec','out-hex'].forEach(id => document.getElementById(id).textContent = '—');
    document.getElementById('out-nibble').textContent = '';
    return;
  }

  errEl.textContent = '';
  const decimal = parseInt(val, base);

  if (!isFinite(decimal) || decimal > Number.MAX_SAFE_INTEGER) {
    errEl.textContent = 'Number too large (max 2⁵³)';
    return;
  }

  const bin = decimal.toString(2);
  document.getElementById('out-bin').textContent = bin;
  document.getElementById('out-nibble').textContent = 'Nibbles: ' + groupNibbles(bin);
  document.getElementById('out-oct').textContent = decimal.toString(8);
  document.getElementById('out-dec').textContent = decimal.toLocaleString();
  document.getElementById('out-hex').textContent = decimal.toString(16).toUpperCase();
}

document.getElementById('value').addEventListener('input', calculate);
document.getElementById('fromBase').addEventListener('change', calculate);
</script>
