<div class="page">
  <div class="eyebrow">// utility.roman_numerals</div>
  <h1>Roman Numeral <em>Converter</em></h1>
  <p class="page-desc">Convert integers to Roman numerals and Roman numerals back to integers. Supports 1–3999 with full symbol breakdown.</p>

  <div class="tool-layout">
    <div class="card">
      <div class="card-label">Input</div>
      <div class="field-group">
        <label for="mode">Direction</label>
        <select id="mode">
          <option value="to_roman">Integer → Roman</option>
          <option value="to_int">Roman → Integer</option>
        </select>
      </div>
      <div class="field-group">
        <label for="value" id="value-label">Integer (1–3999)</label>
        <input type="text" id="value" placeholder="e.g. 2024"/>
        <div class="error-msg" id="error-msg"></div>
      </div>
    </div>

    <div>
      <div class="result-hero">
        <div class="rh-label" id="result-label">Result</div>
        <div class="rh-val" id="out-result">—</div>
      </div>
      <div class="breakdown-box">
        <div class="breakdown-label">Symbol Breakdown</div>
        <div class="symbol-row" id="out-breakdown"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SYMBOLS = [
  ['M',1000],['CM',900],['D',500],['CD',400],
  ['C',100],['XC',90],['L',50],['XL',40],
  ['X',10],['IX',9],['V',5],['IV',4],['I',1]
];

function toRoman(n) {
  let result = '', breakdown = [];
  for (const [sym, val] of SYMBOLS) {
    while (n >= val) { result += sym; breakdown.push({sym, val}); n -= val; }
  }
  return { result, breakdown };
}

function fromRoman(s) {
  const map = {M:1000,D:500,C:100,L:50,X:10,V:5,I:1};
  let total = 0, breakdown = [];
  const upper = s.toUpperCase();
  for (let i = 0; i < upper.length; i++) {
    const cur = map[upper[i]], next = map[upper[i+1]];
    if (!cur) return null;
    if (next && cur < next) { breakdown.push({sym: upper[i]+upper[i+1], val: next-cur}); total += next - cur; i++; }
    else { breakdown.push({sym: upper[i], val: cur}); total += cur; }
  }
  return { result: total, breakdown };
}

function calculate() {
  const mode = document.getElementById('mode').value;
  const val = document.getElementById('value').value.trim();
  const errEl = document.getElementById('error-msg');
  const label = document.getElementById('value-label');
  label.textContent = mode === 'to_roman' ? 'Integer (1–3999)' : 'Roman Numeral';

  errEl.textContent = '';
  if (!val) {
    document.getElementById('out-result').textContent = '—';
    document.getElementById('out-breakdown').innerHTML = '';
    return;
  }

  if (mode === 'to_roman') {
    const n = parseInt(val);
    if (isNaN(n) || n < 1 || n > 3999) { errEl.textContent = 'Enter an integer between 1 and 3999'; document.getElementById('out-result').textContent = '—'; return; }
    const { result, breakdown } = toRoman(n);
    document.getElementById('result-label').textContent = 'Roman Numeral';
    document.getElementById('out-result').textContent = result;
    document.getElementById('out-breakdown').innerHTML = breakdown.map(b =>
      `<div class="sym-chip"><div class="sym-roman">${b.sym}</div><div class="sym-val">${b.val}</div></div>`
    ).join('');
  } else {
    const parsed = fromRoman(val);
    if (!parsed || parsed.result < 1 || parsed.result > 3999) { errEl.textContent = 'Invalid Roman numeral'; document.getElementById('out-result').textContent = '—'; return; }
    document.getElementById('result-label').textContent = 'Integer Value';
    document.getElementById('out-result').textContent = parsed.result.toLocaleString();
    document.getElementById('out-breakdown').innerHTML = parsed.breakdown.map(b =>
      `<div class="sym-chip"><div class="sym-roman">${b.sym}</div><div class="sym-val">${b.val}</div></div>`
    ).join('');
  }
}

document.getElementById('value').addEventListener('input', calculate);
document.getElementById('mode').addEventListener('change', calculate);
</script>
