<nav>

<div class="page">
  <div class="eyebrow">// number theory.prime_list</div>
  <h1>Prime Number <em>List Generator</em></h1>
  <p class="page-desc">Generate all prime numbers up to N using the Sieve of Eratosthenes. Supports up to 1,000,000.</p>

  <div class="controls">
    <div class="field-group">
      <label for="limit">Generate primes up to</label>
      <input type="number" id="limit" value="100" min="2" max="1000000" step="1"/>
    </div>
    <button class="btn" onclick="generate()">Generate</button>
    <button class="btn btn-outline" onclick="copyList()">Copy List</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="sc-label">Count</div><div class="sc-val accent" id="out-count">—</div></div>
    <div class="stat-card"><div class="sc-label">Largest Prime</div><div class="sc-val" id="out-largest">—</div></div>
    <div class="stat-card"><div class="sc-label">Density (per 100)</div><div class="sc-val" id="out-density">—</div></div>
    <div class="stat-card"><div class="sc-label">Compute Time</div><div class="sc-val" id="out-time">—</div></div>
  </div>

  <div class="prime-grid" id="prime-grid"></div>
  <div class="time-note" id="time-note"></div>
</div>

<script>
let lastPrimes = [];

function sieve(limit) {
  const composite = new Uint8Array(limit + 1);
  composite[0] = composite[1] = 1;
  for (let i = 2; i * i <= limit; i++) {
    if (!composite[i]) for (let j = i * i; j <= limit; j += i) composite[j] = 1;
  }
  const primes = [];
  for (let i = 2; i <= limit; i++) if (!composite[i]) primes.push(i);
  return primes;
}

function generate() {
  const limit = parseInt(document.getElementById('limit').value);
  if (isNaN(limit) || limit < 2) return;
  if (limit > 1000000) { document.getElementById('limit').value = 1000000; return generate(); }

  const t0 = performance.now();
  const primes = sieve(limit);
  const t1 = performance.now();
  lastPrimes = primes;

  document.getElementById('out-count').textContent = primes.length.toLocaleString();
  document.getElementById('out-largest').textContent = primes.length ? primes[primes.length - 1].toLocaleString() : '—';
  document.getElementById('out-density').textContent = ((primes.length / limit) * 100).toFixed(2);
  document.getElementById('out-time').textContent = (t1 - t0).toFixed(1) + 'ms';

  const grid = document.getElementById('prime-grid');
  const display = primes.slice(0, 5000);
  grid.innerHTML = display.map(p => `<span class="prime-chip">${p}</span>`).join('');
  if (primes.length > 5000) {
    const note = document.createElement('div');
    note.style.cssText = 'width:100%;font-size:12px;color:var(--text-dim);padding:8px 0;';
    note.textContent = `Showing first 5,000 of ${primes.length.toLocaleString()} primes. Copy to get all.`;
    grid.appendChild(note);
  }
}

function copyList() {
  if (!lastPrimes.length) return;
  navigator.clipboard.writeText(lastPrimes.join(', ')).then(() => {
    const btn = document.querySelector('.btn-outline');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy List', 2000);
  });
}

generate();
</script>
</body>
