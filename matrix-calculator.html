<style>

:root{--bg:#080b10;--surface:#0e1219;--surface2:#131821;--surface3:#181f2a;--border:#1c2230;--border2:#252f40;--accent:#e8a020;--accent-dim:rgba(232,160,32,.12);--text:#eef1f6;--text-mid:#8a97ab;--text-dim:#4a5568;--green:#34c97c;--coral:#ff6b6b;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5;}

select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;cursor:pointer;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%234a5568' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px;appearance:none;}
select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}

@media(max-width:768px){.matrices-row{grid-template-columns:1fr;}}

.dim-label{font-size:12px;color:var(--text-dim);}

<body>
<nav>
  <a href="/" class="logo"><span class="logo-dot"></span>mymathtools</a>
  <div class="nav-right">
    <a href="/" class="nav-link">← All Tools</a>
    <span class="nav-tag">FREE</span>
  </div>
</nav>
<div class="page">
  <div class="eyebrow">// linear algebra.matrix_calculator</div>
  <h1>Matrix <em>Calculator</em></h1>
  <p class="page-desc">Perform matrix operations: addition, subtraction, multiplication, transpose, determinant, and inverse for matrices up to 4×4.</p>

  <div class="controls">
    <div class="field-group">
      <label for="op">Operation</label>
      <select id="op" onchange="calculate()">
        <option value="add">A + B (Add)</option>
        <option value="sub">A − B (Subtract)</option>
        <option value="mul">A × B (Multiply)</option>
        <option value="transpose">Transpose A</option>
        <option value="det">Determinant of A</option>
        <option value="inv">Inverse of A</option>
      </select>
    </div>
  </div>

  <div class="matrices-row">
    <div class="matrix-card">
      <div class="matrix-label">Matrix A</div>
      <div class="dim-row">
        <select class="dim-select" id="rowsA" onchange="buildGrids()">
          <option>1</option><option>2</option><option selected>3</option><option>4</option>
        </select>
        <span class="dim-label">rows ×</span>
        <select class="dim-select" id="colsA" onchange="buildGrids()">
          <option>1</option><option>2</option><option selected>3</option><option>4</option>
        </select>
        <span class="dim-label">cols</span>
      </div>
      <div class="matrix-grid" id="gridA"></div>
    </div>
    <div class="matrix-card" id="matrixB-card">
      <div class="matrix-label">Matrix B</div>
      <div class="dim-row">
        <select class="dim-select" id="rowsB" onchange="buildGrids()">
          <option>1</option><option>2</option><option selected>3</option><option>4</option>
        </select>
        <span class="dim-label">rows ×</span>
        <select class="dim-select" id="colsB" onchange="buildGrids()">
          <option>1</option><option>2</option><option selected>3</option><option>4</option>
        </select>
        <span class="dim-label">cols</span>
      </div>
      <div class="matrix-grid" id="gridB"></div>
    </div>
  </div>

  <div class="result-card">
    <div class="result-label">Result</div>
    <div id="result-output"><div style="color:var(--text-dim);font-size:13px;">Configure matrices above</div></div>
  </div>
</div>

<script>
function buildGrids() {
  const op = document.getElementById('op').value;
  const needsB = ['add','sub','mul'].includes(op);
  document.getElementById('matrixB-card').style.opacity = needsB ? '1' : '0.3';

  buildGrid('A', parseInt(document.getElementById('rowsA').value), parseInt(document.getElementById('colsA').value));
  buildGrid('B', parseInt(document.getElementById('rowsB').value), parseInt(document.getElementById('colsB').value));
  calculate();
}

function buildGrid(name, rows, cols) {
  const grid = document.getElementById('grid' + name);
  grid.style.gridTemplateColumns = `repeat(${cols}, 60px)`;
  const existing = grid.querySelectorAll('input');
  const vals = Array.from(existing).map(i => i.value);
  grid.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const inp = document.createElement('input');
      inp.value = vals[r * cols + c] || '0';
      inp.addEventListener('input', calculate);
      grid.appendChild(inp);
    }
  }
}

function getMatrix(name) {
  const rows = parseInt(document.getElementById('rows' + name).value);
  const cols = parseInt(document.getElementById('cols' + name).value);
  const inputs = document.getElementById('grid' + name).querySelectorAll('input');
  const m = [];
  for (let r = 0; r < rows; r++) {
    m.push([]);
    for (let c = 0; c < cols; c++) m[r].push(parseFloat(inputs[r * cols + c].value) || 0);
  }
  return m;
}

function det(m) {
  const n = m.length;
  if (n === 1) return m[0][0];
  if (n === 2) return m[0][0]*m[1][1] - m[0][1]*m[1][0];
  let d = 0;
  for (let c = 0; c < n; c++) {
    const sub = m.slice(1).map(row => row.filter((_, j) => j !== c));
    d += (c % 2 === 0 ? 1 : -1) * m[0][c] * det(sub);
  }
  return d;
}

function inv(m) {
  const n = m.length;
  const aug = m.map((row, i) => [...row, ...Array.from({length:n}, (_, j) => i === j ? 1 : 0)]);
  for (let i = 0; i < n; i++) {
    let pivot = aug[i][i];
    if (Math.abs(pivot) < 1e-10) return null;
    for (let j = 0; j < 2*n; j++) aug[i][j] /= pivot;
    for (let k = 0; k < n; k++) {
      if (k === i) continue;
      const f = aug[k][i];
      for (let j = 0; j < 2*n; j++) aug[k][j] -= f * aug[i][j];
    }
  }
  return aug.map(row => row.slice(n));
}

function renderMatrix(m) {
  const cols = m[0].length;
  const grid = document.createElement('div');
  grid.className = 'result-matrix';
  grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  m.forEach(row => row.forEach(v => {
    const cell = document.createElement('div');
    cell.className = 'result-cell';
    cell.textContent = parseFloat(v.toFixed(6)).toString();
    grid.appendChild(cell);
  }));
  return grid;
}

function calculate() {
  const op = document.getElementById('op').value;
  const A = getMatrix('A'), B = getMatrix('B');
  const rA = A.length, cA = A[0].length, rB = B.length, cB = B[0].length;
  const out = document.getElementById('result-output');

  try {
    let result;
    if (op === 'add' || op === 'sub') {
      if (rA !== rB || cA !== cB) { out.innerHTML = `<div class="error-box">Dimension mismatch: A is ${rA}×${cA}, B is ${rB}×${cB}. Must be equal for add/subtract.</div>`; return; }
      result = A.map((row, r) => row.map((v, c) => op === 'add' ? v + B[r][c] : v - B[r][c]));
      out.innerHTML = ''; out.appendChild(renderMatrix(result));
    } else if (op === 'mul') {
      if (cA !== rB) { out.innerHTML = `<div class="error-box">Dimension mismatch: A cols (${cA}) must equal B rows (${rB}) for multiplication.</div>`; return; }
      result = Array.from({length:rA}, (_, r) => Array.from({length:cB}, (_, c) => A[r].reduce((s, _, k) => s + A[r][k]*B[k][c], 0)));
      out.innerHTML = ''; out.appendChild(renderMatrix(result));
    } else if (op === 'transpose') {
      result = Array.from({length:cA}, (_, c) => Array.from({length:rA}, (_, r) => A[r][c]));
      out.innerHTML = ''; out.appendChild(renderMatrix(result));
    } else if (op === 'det') {
      if (rA !== cA) { out.innerHTML = `<div class="error-box">Determinant requires a square matrix. A is ${rA}×${cA}.</div>`; return; }
      const d = det(A);
      out.innerHTML = `<div class="scalar-result">${parseFloat(d.toFixed(8)).toString()}</div>`;
    } else if (op === 'inv') {
      if (rA !== cA) { out.innerHTML = `<div class="error-box">Inverse requires a square matrix.</div>`; return; }
      const i = inv(A);
      if (!i) { out.innerHTML = `<div class="error-box">Matrix is singular (determinant = 0). Inverse does not exist.</div>`; return; }
      out.innerHTML = ''; out.appendChild(renderMatrix(i));
    }
  } catch(e) {
    out.innerHTML = `<div class="error-box">Calculation error: ${e.message}</div>`;
  }
}

buildGrids();
</script>
</body>
