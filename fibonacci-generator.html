<div class="page">
  <div class="eyebrow">// sequences.fibonacci_generator</div>
  <h1>Fibonacci Number <em>Generator</em></h1>
  <p class="page-desc">Generate the first N Fibonacci numbers and check if any number belongs to the Fibonacci sequence.</p>

  <div class="tool-layout">
    <div class="card">
      <div class="card-label">Inputs</div>
      <div class="field-group">
        <label for="count">How many terms (max 78)</label>
        <input type="number" id="count" value="10" min="1" max="78" step="1"/>
      </div>
      <div class="field-group">
        <label for="check">Check if a number is Fibonacci</label>
        <input type="number" id="check" placeholder="Optional — enter any number" step="1" min="0"/>
        <div class="check-result empty" id="check-result">Enter a number above to check</div>
      </div>
      <button class="btn" onclick="copyList()">Copy List</button>
    </div>

    <div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Index (n)</th><th>F(n)</th><th>Ratio F(n)/F(n-1)</th></tr>
          </thead>
          <tbody id="fib-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let fibList = [];

function isFibonacci(n) {
  // A number is Fibonacci if 5n²+4 or 5n²-4 is a perfect square
  function isPerfectSquare(x) { const s = Math.round(Math.sqrt(x)); return s * s === x; }
  return isPerfectSquare(5 * n * n + 4) || isPerfectSquare(5 * n * n - 4);
}

function calculate() {
  const count = Math.min(78, Math.max(1, parseInt(document.getElementById('count').value) || 10));
  const fibs = [0, 1];
  while (fibs.length < count) fibs.push(fibs[fibs.length - 1] + fibs[fibs.length - 2]);
  fibList = fibs.slice(0, count);

  document.getElementById('fib-table').innerHTML = fibList.map((f, i) => {
    const ratio = i > 1 ? (f / fibList[i - 1]).toFixed(6) : '—';
    return `<tr><td>${i}</td><td>${f.toLocaleString()}</td><td>${ratio}</td></tr>`;
  }).join('');

  checkNumber();
}

function checkNumber() {
  const val = document.getElementById('check').value.trim();
  const box = document.getElementById('check-result');
  if (!val) { box.className = 'check-result empty'; box.textContent = 'Enter a number above to check'; return; }
  const n = parseInt(val);
  if (isNaN(n) || n < 0) { box.className = 'check-result no'; box.textContent = 'Invalid input'; return; }
  const result = isFibonacci(n);
  box.className = 'check-result ' + (result ? 'yes' : 'no');
  box.textContent = result ? `✓ ${n} IS a Fibonacci number` : `✗ ${n} is NOT a Fibonacci number`;
}

function copyList() {
  navigator.clipboard.writeText(fibList.join(', ')).then(() => {
    const btn = document.querySelector('.btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy List', 2000);
  });
}

document.getElementById('count').addEventListener('input', calculate);
document.getElementById('check').addEventListener('input', checkNumber);
calculate();
</script>
