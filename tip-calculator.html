<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#080b10;--surface:#0e1219;--surface2:#131821;--surface3:#181f2a;--border:#1c2230;--border2:#252f40;--accent:#e8a020;--accent-dim:rgba(232,160,32,.12);--accent-glow:rgba(232,160,32,.22);--text:#eef1f6;--text-mid:#8a97ab;--text-dim:#4a5568;--green:#34c97c;--blue:#4a9eff;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5;}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(8,11,16,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
.logo-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-link{font-size:12px;color:var(--text-mid);text-decoration:none;transition:color .2s;}
.nav-link:hover{color:var(--text);}
.nav-tag{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,160,32,.3);padding:3px 9px;border-radius:3px;letter-spacing:.06em;}
.page{max-width:960px;margin:0 auto;padding:48px 32px 80px;position:relative;z-index:1;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,42px);font-weight:500;letter-spacing:-.025em;line-height:1.1;}
h1 em{font-style:italic;color:var(--accent);}
.page-desc{margin-top:10px;font-size:14px;font-weight:300;color:var(--text-mid);line-height:1.6;}
.tool-layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:40px;align-items:start;}
@media(max-width:768px){.tool-layout{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;}
.card-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px;}
.field-group{margin-bottom:18px;}
label{display:block;font-size:12px;font-weight:500;color:var(--text-mid);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px;}
.input-wrap{position:relative;}
.pfx{position:absolute;top:50%;transform:translateY(-50%);left:13px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);pointer-events:none;}
input[type=number]{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.has-pfx{padding-left:28px;}
.quick-tips{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tip-btn{padding:7px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;font-size:13px;color:var(--text-mid);cursor:pointer;transition:all .2s;}
.tip-btn:hover,.tip-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,160,32,.4);}
.result-card{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:24px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.result-row:last-child{border-bottom:none;}
.result-label{font-size:13px;color:var(--text-mid);}
.result-value{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--text);font-weight:500;}
.result-value.accent{color:var(--accent);}
.result-value.green{color:var(--green);}
.result-value.big{font-size:28px;}
</style>

<body>
<nav>
  <a href="/" class="logo"><span class="logo-dot"></span>mymathtools</a>
  <div class="nav-right">
    <a href="/" class="nav-link">← All Tools</a>
    <span class="nav-tag">FREE</span>
  </div>
</nav>
<div class="page">
  <div class="eyebrow">// everyday.tip_calculator</div>
  <h1>Tip <em>Calculator</em></h1>
  <p class="page-desc">Calculate tip amount, total bill, and per-person share — instantly. Quick-select common tip percentages.</p>

  <div class="tool-layout">
    <div class="card">
      <div class="card-label">Inputs</div>

      <div style="margin-bottom:14px;">
        <label>Quick Tip</label>
        <div class="quick-tips">
          <button class="tip-btn" onclick="setTip(15)">15%</button>
          <button class="tip-btn active" onclick="setTip(18)">18%</button>
          <button class="tip-btn" onclick="setTip(20)">20%</button>
          <button class="tip-btn" onclick="setTip(25)">25%</button>
        </div>
      </div>

      <div class="field-group">
        <label for="bill">Bill Amount</label>
        <div class="input-wrap">
          <span class="pfx">$</span>
          <input type="number" id="bill" class="has-pfx" placeholder="0.00" step="0.01" min="0"/>
        </div>
      </div>
      <div class="field-group">
        <label for="tip">Tip Percentage (%)</label>
        <input type="number" id="tip" value="18" step="1" min="0" max="100"/>
      </div>
      <div class="field-group">
        <label for="split">Number of People</label>
        <input type="number" id="split" value="1" step="1" min="1"/>
      </div>
    </div>

    <div class="result-card">
      <div class="result-row">
        <span class="result-label">Tip Amount</span>
        <span class="result-value accent" id="out-tip">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Total Bill</span>
        <span class="result-value" id="out-total">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Per Person</span>
        <span class="result-value green big" id="out-per">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Tip Per Person</span>
        <span class="result-value" id="out-tip-per">—</span>
      </div>
    </div>
  </div>
</div>

<script>
const billEl = document.getElementById('bill');
const tipEl = document.getElementById('tip');
const splitEl = document.getElementById('split');

function fmt(n) { return '$' + n.toFixed(2); }

function calculate() {
  const bill = parseFloat(billEl.value);
  const tipPct = parseFloat(tipEl.value);
  const split = Math.max(1, parseInt(splitEl.value) || 1);

  if (isNaN(bill) || isNaN(tipPct)) {
    ['out-tip','out-total','out-per','out-tip-per'].forEach(id => document.getElementById(id).textContent = '—');
    return;
  }

  const tipAmt = bill * (tipPct / 100);
  const total = bill + tipAmt;
  const perPerson = total / split;
  const tipPerPerson = tipAmt / split;

  document.getElementById('out-tip').textContent = fmt(tipAmt);
  document.getElementById('out-total').textContent = fmt(total);
  document.getElementById('out-per').textContent = fmt(perPerson);
  document.getElementById('out-tip-per').textContent = fmt(tipPerPerson);
}

function setTip(pct) {
  tipEl.value = pct;
  document.querySelectorAll('.tip-btn').forEach(b => b.classList.toggle('active', parseInt(b.textContent) === pct));
  calculate();
}

document.querySelectorAll('input').forEach(el => el.addEventListener('input', calculate));
calculate();
</script>
</body>
