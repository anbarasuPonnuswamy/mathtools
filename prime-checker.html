<div class="page">
  <div class="eyebrow">// number theory.prime_checker</div>
  <h1>Prime Number <em>Checker</em></h1>
  <p class="page-desc">Check if any integer is prime, see all its factors, and find the smallest prime factor — instantly as you type.</p>

  <div class="tool-layout">
    <div class="card">
      <div class="card-label">Input</div>
      <label for="number">Integer to check</label>
      <input type="number" id="number" placeholder="e.g. 97" min="1" step="1"/>
    </div>

    <div>
      <div class="verdict empty" id="verdict-box">
        <div class="verdict-icon" id="verdict-icon">🔢</div>
        <div class="verdict-text" id="verdict-text" style="color:var(--text-dim);">Enter a number</div>
      </div>
      <div class="card">
        <div class="result-row">
          <span class="result-label">All Factors</span>
          <span class="result-value" id="out-factors">—</span>
        </div>
        <div class="result-row">
          <span class="result-label">Factor Count</span>
          <span class="result-value" id="out-count">—</span>
        </div>
        <div class="result-row">
          <span class="result-label">Smallest Prime Factor</span>
          <span class="result-value" id="out-spf">—</span>
        </div>
        <div class="result-row">
          <span class="result-label">Prime Factorization</span>
          <span class="result-value" id="out-pf">—</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function isPrime(n) {
  if (n < 2) return false;
  if (n === 2) return true;
  if (n % 2 === 0) return false;
  for (let i = 3; i <= Math.sqrt(n); i += 2) if (n % i === 0) return false;
  return true;
}

function getFactors(n) {
  const factors = [];
  for (let i = 1; i <= Math.sqrt(n); i++) {
    if (n % i === 0) {
      factors.push(i);
      if (i !== n / i) factors.push(n / i);
    }
  }
  return factors.sort((a, b) => a - b);
}

function primeFactorization(n) {
  const counts = {};
  let d = 2;
  while (d * d <= n) {
    while (n % d === 0) { counts[d] = (counts[d] || 0) + 1; n = Math.floor(n / d); }
    d++;
  }
  if (n > 1) counts[n] = (counts[n] || 0) + 1;
  return Object.entries(counts).map(([p, e]) => e > 1 ? `${p}^${e}` : p).join(' × ');
}

function calculate() {
  const val = document.getElementById('number').value.trim();
  const box = document.getElementById('verdict-box');
  const icon = document.getElementById('verdict-icon');
  const text = document.getElementById('verdict-text');

  if (!val) {
    box.className = 'verdict empty'; icon.textContent = '🔢'; text.textContent = 'Enter a number'; text.className = 'verdict-text';
    ['out-factors','out-count','out-spf','out-pf'].forEach(id => document.getElementById(id).textContent = '—');
    return;
  }

  const n = parseInt(val);
  if (isNaN(n) || n < 1) {
    box.className = 'verdict not-prime'; icon.textContent = '❌'; text.textContent = 'Invalid input'; text.className = 'verdict-text not-prime';
    return;
  }

  const prime = isPrime(n);
  box.className = 'verdict ' + (prime ? 'prime' : 'not-prime');
  icon.textContent = prime ? '✓' : '✗';
  text.textContent = prime ? `${n} is PRIME` : `${n} is NOT prime`;
  text.className = 'verdict-text ' + (prime ? 'prime' : 'not-prime');

  const factors = getFactors(n);
  document.getElementById('out-factors').textContent = factors.join(', ');
  document.getElementById('out-count').textContent = factors.length;
  document.getElementById('out-spf').textContent = prime ? n : factors.find(f => f > 1 && isPrime(f));
  document.getElementById('out-pf').textContent = n === 1 ? '1' : primeFactorization(n);
}

document.getElementById('number').addEventListener('input', calculate);
</script>
